memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_vars = 5000

; Order emails go to Mailpit in dev; in prod point these at your real relay.
sendmail_path = "/usr/sbin/sendmail -t -i"
SMTP = mail
smtp_port = 1025

expose_php = Off
display_errors = Off
log_errors = On
