# Shirt That's Funny — vhost for the Hetzner host's own nginx.
# Installed at /etc/nginx/sites-available/shirtthatsfunny and symlinked into
# sites-enabled. Certbot appends the TLS blocks once DNS points at this box:
#
#   certbot --nginx -d shirtthatsfunny.com -d www.shirtthatsfunny.com -d cms.shirtthatsfunny.com

# ── Storefront (Next.js on 127.0.0.1:34000) ─────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name shirtthatsfunny.com www.shirtthatsfunny.com;

    client_max_body_size 32m;

    # Build output is content-hashed, so it can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:34000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:34000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# ── WordPress / WooCommerce (Apache on 127.0.0.1:34080) ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cms.shirtthatsfunny.com;

    # Media uploads and plugin installs need room.
    client_max_body_size 128m;

    location = /xmlrpc.php { deny all; }
    location ~* /(?:wp-config\.php|readme\.html|license\.txt)$ { deny all; }

    location /wp-content/uploads/ {
        proxy_pass http://127.0.0.1:34080;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:34080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Plugin installs and Woo imports are slow; don't cut them off.
        proxy_read_timeout 300s;
    }
}
